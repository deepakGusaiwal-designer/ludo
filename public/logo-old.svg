<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield Base -->
  <rect x="8" y="8" width="84" height="84" rx="24" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.3)" stroke-width="3" />

  <!-- Inner Dark Board Area -->
  <rect x="18" y="18" width="64" height="64" rx="16" fill="#061c14" opacity="0.9" />

  <!-- 4 Colored Player Corners -->
  <circle cx="34" cy="34" r="9" fill="#ef4444" filter="url(#glow)" />
  <circle cx="66" cy="34" r="9" fill="#10b981" filter="url(#glow)" />
  <circle cx="66" cy="66" r="9" fill="#eab308" filter="url(#glow)" />
  <circle cx="34" cy="66" r="9" fill="#3b82f6" filter="url(#glow)" />

  <!-- Center Dice / Cross Symbol -->
  <rect x="42" y="42" width="16" height="16" rx="4" fill="#ffffff" />
  <circle cx="50" cy="50" r="3" fill="#047857" />
</svg>
