  ========================================================= */

      function checkPlayerWin(color) {
        if (tokensHome(color) < LUDO_GAME.TOKENS_TO_WIN) {
          return false;
        }

        LUDO_GAME.gameOver = true;

        LUDO_GAME.winner = color;

        LUDO_GAME.busy = false;

        LUDO_GAME.awaitingToken = false;

        LUDO_GAME.diceValue = null;

        clearTokenHighlights();

        setMessage(`${labelFor(color)} has all four tokens home.`);

        updateHud();

        winTitle.textContent = `${labelFor(color)} wins`;

        winOverlay.classList.add("show");

        if (window.onLudoWin) {
          window.onLudoWin(color);
        }

        return true;
      }

      /* =========================================================
     TOKEN CLICK
  ========================================================= */

      function selectToken(token) {
        if (!LUDO_GAME.awaitingToken) {
          return;
        }

        if (token.userData.color !== currentPlayer().color) {
          return;
        }

        moveSelectedToken(token);
      }

      renderer.domElement.addEventListener("click", (event) => {
        if (!LUDO_GAME.awaitingToken) {
          return;
        }

        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;

        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);

        const meshes = [];

        tokens.forEach((token) => {
          token.traverse((child) => {
            if (child.isMesh) {
              meshes.push(child);
            }
          });
        });

        const hits = raycaster.intersectObjects(meshes);

        if (!hits.length) {
          return;
        }

        let selected = hits[0].object;

        while (selected && !selected.userData?.color) {
          selected = selected.parent;
        }

        if (selected) {
          selectToken(selected);
        }
      });

      /* =========================================================
     START / RESTART
  ========================================================= */

      function startLudoGame() {
        LUDO_GAME.gameStarted = true;

        LUDO_GAME.gameOver = false;

        LUDO_GAME.winner = null;

        LUDO_GAME.currentPlayer = 0;

        LUDO_GAME.diceValue = null;

        LUDO_GAME.awaitingToken = false;

        LUDO_GAME.busy = false;

        LUDO_GAME.sixCount = 0;

        clearTokenHighlights();

        tokens.forEach((token) => {
          gsap.killTweensOf(token.position);

          token.userData.animating = false;

          token.userData.state = {
            status: "yard",

            relativePosition: -1,

            trackIndex: null,

            homeIndex: token.userData.id - 1,

            finished: false,
          };
        });

        refreshTokenPlacements();

        winOverlay.classList.remove("show");

        setMessage("Red to roll. A 6 brings a token out of the yard.");

        updateHud();

        resetCamera();
      }

      rollButton.addEventListener("click", requestRoll);

      restartButton.addEventListener("click", () => {
        winOverlay.classList.remove("show");

        startLudoGame();
      });

      /* =========================================================
     PUBLIC API
  ========================================================= */

      window.LudoGame = {
        board: boardGroup,

        dice: diceGroup,

        tokens,

        state: LUDO_GAME,

        commonTrack: COMMON_TRACK,

        homeLanes: HOME_LANES,

        safeCells: SAFE_TRACK_INDEXES,

        start: startLudoGame,

        roll: requestRoll,

        /*
         * rollDice(value) forces a face, which is handy for
         * testing a specific position
         */
        rollDice,

        selectToken,

        getValidTokens,

        nextPlayer,

        resetCamera,

        focusCameraOn,

        getDiceValue() {
          return currentDiceValue;
        },
      };

      startLudoGame();
    </script>
  </body>
</html>
